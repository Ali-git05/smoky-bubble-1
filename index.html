<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />

    <!-- Prevent zoom, lock viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- PWA / fullscreen kiosk -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-immersive" />
    <meta name="apple-mobile-web-app-title" content="Smoky Bubble" />
    <meta name="theme-color" content="#2c2c2a" />

    <!-- Home screen icons (Apple) -->
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- PWA manifest — swapped per route so staff and customer install as separate apps -->
    <link rel="manifest" href="/manifest-staff.json" id="pwa-manifest" />
    <script>
      (function () {
        if (window.location.pathname.startsWith('/customer')) {
          document.getElementById('pwa-manifest').href = '/manifest-customer.json';
        }
      })();
    </script>

    <title>Smoky Bubble</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
